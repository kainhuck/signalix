syntax = "proto3";

package signalix.engine.v1;

option go_package = "github.com/kainhuck/signalix/api/gen/go/signalix/engine/v1;enginev1";

// Engine 控制面与只读查询（单 service，注释分组）。

// --- Control ---
service Engine {
  rpc Ping(PingRequest) returns (PingReply);

  // GetHealth 返回引擎就绪状态（readiness）；与 Ping（liveness）互补。
  rpc GetHealth(GetHealthRequest) returns (GetHealthReply);

  rpc GetEngineInfo(GetEngineInfoRequest) returns (GetEngineInfoReply);

  // ListStrategies 返回 catalog（Discover 结果），含未运行条目及运行时字段。
  rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesReply);

  rpc GetStrategyStatus(GetStrategyStatusRequest) returns (GetStrategyStatusReply);

  rpc StartStrategy(StartStrategyRequest) returns (StartStrategyReply);

  rpc StopStrategy(StopStrategyRequest) returns (StopStrategyReply);

  // ReloadStrategies 仅重新扫描目录并刷新内存 catalog，不自动启停已运行进程。
  rpc ReloadStrategies(ReloadStrategiesRequest) returns (ReloadStrategiesReply);

  // --- Query ---
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceReply);
  rpc GetPosition(GetPositionRequest) returns (GetPositionReply);
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsReply);

  rpc GetOrder(GetOrderRequest) returns (GetOrderReply);

  rpc ListOpenOrders(ListOpenOrdersRequest) returns (ListOpenOrdersReply);

  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderReply);

  // --- Stream ---
  rpc SubscribeOrderEvents(SubscribeOrderEventsRequest) returns (stream Order);

  // --- Emergency ---
  rpc ActivateKillSwitch(ActivateKillSwitchRequest) returns (ActivateKillSwitchReply);
  rpc DeactivateKillSwitch(DeactivateKillSwitchRequest) returns (DeactivateKillSwitchReply);
  rpc GetKillSwitchStatus(GetKillSwitchStatusRequest) returns (GetKillSwitchStatusReply);
}

message PingRequest {}

message PingReply {
  string pong = 1;
  int64 server_time_unix_ms = 2;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

enum ComponentStatus {
  COMPONENT_STATUS_UNSPECIFIED = 0;
  COMPONENT_STATUS_PASS = 1;
  COMPONENT_STATUS_FAIL = 2;
}

message GetHealthRequest {
  // true 时不探测交易所（checks 中省略 exchange）。
  bool skip_exchange_ping = 1;
}

message HealthCheck {
  string name = 1;
  ComponentStatus status = 2;
  string message = 3;
}

message GetHealthReply {
  HealthStatus status = 1;
  int64 server_time_unix_ms = 2;
  repeated HealthCheck checks = 3;
  bool kill_switch_active = 4;
}

message GetEngineInfoRequest {}

message GetEngineInfoReply {
  string version = 1;
  string strategies_dir = 2;
  string go_version = 3;
}

message ListStrategiesRequest {}

message StrategySummary {
  string name = 1;
  bool enabled = 2;
  repeated string symbols = 3;
  bool running = 4;
  int64 last_heartbeat_unix_ms = 5;
  int32 crash_count = 6;
  int32 crash_count_in_window = 7;
  bool auto_restart_enabled = 8;
  double restart_backoff_sec = 9;
  bool circuit_open = 10;
}

message GetStrategyStatusRequest {
  string name = 1;
}

message GetStrategyStatusReply {
  StrategySummary status = 1;
}

message ListStrategiesReply {
  repeated StrategySummary strategies = 1;
}

message StartStrategyRequest {
  string name = 1;
}

message StartStrategyReply {}

message StopStrategyRequest {
  string name = 1;
}

message StopStrategyReply {}

message ReloadStrategiesRequest {}

message ReloadStrategiesReply {
  int32 catalog_count = 1;
}

message Balance {
  string currency = 1;
  string total = 2;
  string available = 3;
  string frozen = 4;
  int64 updated_at_unix_ms = 5;
}

message Position {
  string symbol = 1;
  string side = 2;
  string size = 3;
  string entry_price = 4;
  string mark_price = 5;
  string unrealized_pnl = 6;
  int32 leverage = 7;
  int64 updated_at_unix_ms = 8;
}

message GetBalanceRequest {}

message GetBalanceReply {
  Balance balance = 1;
}

message GetPositionRequest {
  string symbol = 1;
}

message GetPositionReply {
  Position position = 1;
}

message ListPositionsRequest {}

message ListPositionsReply {
  repeated Position positions = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderReply {
  Order order = 1;
}

message ListOpenOrdersRequest {
  int32 limit = 1; // <=0 时使用默认 500
}

message ListOpenOrdersReply {
  repeated Order orders = 1;
}

message CancelOrderRequest {
  string order_id = 1;
}

message CancelOrderReply {}

message SubscribeOrderEventsRequest {}

message KillSwitchStatus {
  bool active = 1;
  int64 activated_at_unix_ms = 2;
  string reason = 3;
}

message ActivateKillSwitchRequest {
  string reason = 1;
  bool cancel_open_orders = 2;
}

message ActivateKillSwitchReply {
  KillSwitchStatus status = 1;
  int32 cancel_attempted = 2;
  int32 cancel_failed = 3;
}

message DeactivateKillSwitchRequest {}

message DeactivateKillSwitchReply {
  KillSwitchStatus status = 1;
}

message GetKillSwitchStatusRequest {}

message GetKillSwitchStatusReply {
  KillSwitchStatus status = 1;
}

message Order {
  string id = 1;
  string exchange_id = 2;
  string symbol = 3;
  string side = 4;
  string order_type = 5;
  string size = 6;
  string filled_size = 7;
  string status = 8;
  string price = 9;
  string stop_price = 10;
  string strategy_name = 11;
  int64 created_at_unix_ms = 12;
  int64 updated_at_unix_ms = 13;
}
