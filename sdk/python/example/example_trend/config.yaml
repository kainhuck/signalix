name: example_trend
enabled: true
symbols:
  - BTC/USDT
  - ETH/USDT
interval: "1m"
history_bars: 100
subscribe_ticker: false
# 可选：策略级风控（不写 risk 段则仅使用 config.toml [risk] 全局规则）
# risk:
#   max_open_orders: 10
#   max_daily_loss: 1000

parameters:
  ma_fast: 10
  ma_slow: 30
  position_pct: "0.1"   # 开仓使用 10% 可用余额（Percent 模式 value 为 0~1）